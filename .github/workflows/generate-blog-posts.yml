name: Generate Blog Posts

on:
  schedule:
    # Monday at 9:00 AM UTC (10:00 AM German time)
    - cron: '0 9 * * 1'
    # Thursday at 9:00 AM UTC (10:00 AM German time)
    - cron: '0 9 * * 4'
  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Maximum posts to generate'
        required: false
        default: '3'
      priority:
        description: 'Priority filter (high, medium, low, or empty for all)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: claude/create-mezzarano-website-dSx7X

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate blog posts
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🚀 Starting blog post generation..."
          node scripts/auto-generate.js
        continue-on-error: true

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain src/content/blog/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📝 New blog posts detected"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No new posts generated"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Count new posts
          NEW_POSTS=$(git status --porcelain src/content/blog/*.md 2>/dev/null | wc -l)

          git add src/content/blog/
          git add src/content/blog-topics.json

          git commit -m "📝 Auto-generate ${NEW_POSTS} blog post(s)

          Generated by GitHub Actions workflow
          Run ID: ${{ github.run_id }}"

          git push

      - name: Trigger deployment (optional)
        if: steps.check_changes.outputs.changes == 'true' && vars.DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST -d {} "${{ vars.DEPLOY_HOOK_URL }}" || true

      - name: Generate workflow summary
        run: |
          echo "## 📊 Blog Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.check_changes.outputs.changes }}" == "true" ]]; then
            echo "✅ **New posts were generated and committed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Generated Files:" >> $GITHUB_STEP_SUMMARY
            git diff --name-only HEAD~1 src/content/blog/ 2>/dev/null | while read file; do
              echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "ℹ️ No new posts were generated in this run." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Topics Status:" >> $GITHUB_STEP_SUMMARY
          UNUSED=$(cat src/content/blog-topics.json | grep '"used": false' | wc -l)
          USED=$(cat src/content/blog-topics.json | grep '"used": true' | wc -l)
          echo "- **Unused topics:** $UNUSED" >> $GITHUB_STEP_SUMMARY
          echo "- **Used topics:** $USED" >> $GITHUB_STEP_SUMMARY
