[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Allow longer execution time for image proxy
  node_bundler = "esbuild"
  
# Environment variables needed (set in Netlify Dashboard):
# - AIRTABLE_API_KEY or AT_TOKEN
# - AIRTABLE_BASE_ID or AT_BASE  
# - AIRTABLE_TABLE_ID or AT_TABLE
