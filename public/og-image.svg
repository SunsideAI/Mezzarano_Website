<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Wuestenrot accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#f84914"/>

  <!-- Main content area -->
  <g transform="translate(80, 120)">
    <!-- Logo/Brand area -->
    <rect x="0" y="0" width="80" height="80" rx="12" fill="#f84914"/>
    <text x="40" y="52" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle">M</text>

    <!-- Name -->
    <text x="100" y="35" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">Sandro Mezzarano</text>
    <text x="100" y="70" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="20">Immobilienmakler</text>

    <!-- Main headline -->
    <text x="0" y="180" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Ihr Immobilienexperte</text>
    <text x="0" y="240" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">in der Region</text>
    <text x="0" y="300" fill="#f84914" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Trier-Mosel</text>

    <!-- Subtext -->
    <text x="0" y="370" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="24">Hermeskeil | Trier | Schweich | Bernkastel-Kues</text>

    <!-- Wuestenrot Partner badge -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="200" height="40" rx="6" fill="#f84914" fill-opacity="0.2" stroke="#f84914" stroke-width="2"/>
      <text x="100" y="27" fill="#f84914" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Wuestenrot Partner</text>
    </g>
  </g>

  <!-- Decorative elements -->
  <circle cx="1050" cy="150" r="120" fill="#f84914" fill-opacity="0.1"/>
  <circle cx="1100" cy="500" r="80" fill="#f84914" fill-opacity="0.15"/>
</svg>
